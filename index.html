<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamaha PSR-SX920 — Tutoriales</title>
<style>
  :root {
    --bg: #0b0f19;
    --card: #141b2d;
    --accent: #6ea8fe;
    --text: #e8ecf4;
    --muted: #9aa4b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #182238, var(--bg) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem;
  }
  h1 {
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 800;
    letter-spacing: 0.02em;
    margin-bottom: 0.25rem;
    text-align: center;
  }
  .author {
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 0.9rem;
    margin-bottom: 3rem;
  }
  .grid {
    display: grid;
    gap: 1.25rem;
    width: 100%;
    max-width: 720px;
    grid-template-columns: 1fr;
  }
  a.card {
    background: var(--card);
    border: 1px solid #232d45;
    border-radius: 16px;
    padding: 1.75rem;
    text-decoration: none;
    color: var(--text);
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  a.card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
  }
  .card h2 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
  }
  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.4;
  }
  .tag {
    align-self: flex-start;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .empty {
    width: 100%;
    max-width: 720px;
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.5;
    background: var(--card);
    border: 1px dashed #232d45;
    border-radius: 16px;
    padding: 2rem 1.5rem;
  }
  .empty .emoji { display: block; font-size: 2rem; margin-bottom: 0.5rem; }
</style>
</head>
<body>
  <a href="https://rubenurbano.github.io/" style="position:fixed;top:1rem;left:1rem;display:inline-flex;align-items:center;gap:0.4rem;background:var(--card);border:1px solid #232d45;color:var(--accent);text-decoration:none;padding:0.5rem 0.9rem;border-radius:999px;font-size:0.85rem;font-weight:600;z-index:10;">← Inicio</a>
  <h1>Yamaha PSR-SX920</h1>
  <p class="author">By: Ruben Sbarsky</p>

  <div class="grid" id="grid">
    <!-- Las tarjetas de tutoriales nuevos se añaden aquí, siempre arriba del todo -->
  </div>

  <div class="empty" id="empty">
    <span class="emoji">🎛️</span>
    Aquí irán apareciendo los tutoriales del Yamaha PSR-SX920.
  </div>

  <script>
    // Oculta el aviso de "colección vacía" en cuanto haya al menos una tarjeta
    if (document.querySelector('#grid .card')) {
      document.getElementById('empty').style.display = 'none';
    }
  </script>
</body>
</html>
